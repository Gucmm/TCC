[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsp-extraction"
version = "0.1.0"
description = "Extração estruturada de promoções de arquivamento de inquéritos do MPSP com SLMs locais"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
slm = [
    "torch>=2.3",
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=0.34",
    "datasets>=2.20",
    "trl>=0.9",
    "huggingface_hub>=0.23",
]
vllm = ["vllm>=0.6"]

[project.scripts]
mpsp = "mpsp.cli:main"

[tool.setuptools]
packages = ["mpsp", "mpsp.backends", "mpsp.benchmarks", "mpsp.slm"]

[tool.pytest.ini_options]
testpaths = ["tests"]